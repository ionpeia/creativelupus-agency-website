<script>
/* Shrink-wrap the teaser to its longest line so the left-aligned block sits truly centred */
(function(){
  var el=document.querySelector('.teaser'); if(!el) return;
  function fit(){
    el.style.width='';
    var r=document.createRange(); r.selectNodeContents(el);
    var left=el.getBoundingClientRect().left, max=0;
    Array.prototype.forEach.call(r.getClientRects(),function(x){ max=Math.max(max,x.right-left); });
    if(max>0) el.style.width=Math.ceil(max)+1+'px';
  }
  var t; function later(){ clearTimeout(t); t=setTimeout(fit,60); }
  fit();
  window.addEventListener('load',fit);
  window.addEventListener('resize',later);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
